*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--paper);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:56px 16px 40px;position:relative}

main{width:100%;max-width:min(420px,100%);display:flex;flex-direction:column;align-items:center}
.tile{width:112px;height:112px;border-radius:28px;background:var(--green);display:grid;place-items:center;text-align:center;box-shadow:0 10px 24px -14px rgba(31,29,26,.5)}
.tile span{font:400 26px/1.02 'Instrument Serif';letter-spacing:-.03em}
.tile i{font-style:italic}
.tile b{font-weight:400;color:var(--pink-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
p.lead{margin-top:26px;text-align:center;font-size:16.5px;line-height:1.45;max-width:340px}
.ico{width:22px;height:22px;flex:none;fill:currentColor}
a.btn{display:flex;align-items:center;gap:14px;background:#FBF8F2;border:1px solid rgba(31,29,26,.14);border-radius:14px;padding:17px 20px;text-decoration:none;color:var(--ink);font-size:16px;font-weight:500;letter-spacing:-.01em;transition:transform .15s ease,background .15s ease,border-color .15s ease}

p.lead em{font-style:normal;background:var(--mark);padding:0 .06em}
nav{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:32px}
a.btn span.sub{display:block;font-size:13px;font-weight:400;opacity:.62;margin-top:2px}
a.btn:hover{background:#fff;border-color:rgba(31,29,26,.3);transform:translateY(-1px)}
a.btn.primary{background:var(--green);border-color:transparent}
a.btn.primary:hover{background:#7FB265}
footer{margin-top:36px;font-size:13px;opacity:.55;text-align:center;line-height:1.5}
